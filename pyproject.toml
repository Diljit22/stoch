[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochcalc"
version = "2.0.0"
description = "High-performance vectorized and symbolic stochastic calculus library."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Diljit Singh"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "sympy>=1.13.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
